<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8d8c0"/>
      <stop offset="100%" stop-color="#8a6040"/>
    </linearGradient>
    <radialGradient id="liquid" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#c88050"/>
      <stop offset="100%" stop-color="#7a4820"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- カップの影 -->
  <ellipse cx="400" cy="435" rx="130" ry="18" fill="#1a1a1a" opacity="0.2"/>

  <!-- カップ本体（湯呑み風） -->
  <path d="M290,220 Q275,400 300,430 Q345,450 400,450 Q455,450 500,430 Q525,400 510,220Z" fill="#3a2818"/>
  <path d="M298,222 Q284,398 308,426 Q351,445 400,445 Q449,445 492,426 Q515,398 502,222Z" fill="#f0e8d8"/>

  <!-- 内側（お茶の色） -->
  <ellipse cx="400" cy="222" rx="102" ry="16" fill="url(#liquid)"/>
  <path d="M298,240 Q400,265 502,240 L502,222 Q400,238 298,222Z" fill="#b87040" opacity="0.5"/>

  <!-- カップの縁 -->
  <ellipse cx="400" cy="220" rx="104" ry="17" fill="#3a2818"/>
  <ellipse cx="400" cy="218" rx="102" ry="15" fill="#e8dcc8"/>

  <!-- 湯気 -->
  <path d="M360,200 Q355,165 365,140 Q370,120 360,100" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  <path d="M400,195 Q395,158 405,132 Q410,110 400,88" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  <path d="M440,200 Q435,163 445,138 Q450,118 440,96" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.5"/>

  <!-- 受け皿 -->
  <ellipse cx="400" cy="443" rx="145" ry="18" fill="#3a2818"/>
  <ellipse cx="400" cy="441" rx="140" ry="15" fill="#e0d4c0"/>

  <!-- テキスト -->
  <text x="400" y="520" font-family="'Noto Serif JP', serif" font-size="32" fill="white" text-anchor="middle" letter-spacing="8" opacity="0.9">ほうじ茶</text>
  <text x="400" y="555" font-family="serif" font-size="14" fill="white" text-anchor="middle" letter-spacing="4" opacity="0.6">HOJICHA</text>
</svg>
