  <!-- 急須本体 -->
  <path d="M270,200 Q255,340 300,400 Q350,440 400,440 Q450,440 500,400 Q545,340 530,200 Q480,160 400,158 Q320,160 270,200Z" fill="#2a1f1a"/>
  <path d="M278,202 Q264,338 308,396 Q356,434 400,434 Q444,434 492,396 Q524,338 522,202 Q474,165 400,163 Q326,165 278,202Z" fill="url(#cup)"/>

  <!-- 蓋 -->
  <ellipse cx="400" cy="200" rx="132" ry="22" fill="#2a1f1a"/>
  <ellipse cx="400" cy="198" rx="128" ry="19" fill="#e0d4c0"/>
  <circle cx="400" cy="182" r="14" fill="#2a1f1a"/>
  <circle cx="400" cy="180" r="12" fill="#d0c4b0"/>

  <!-- 注ぎ口 -->
  <path d="M270,270 Q200,255 185,295 Q182,320 200,325 Q225,330 265,310" fill="#2a1f1a"/>
  <path d="M273,274 Q205,260 192,297 Q189,318 206,323 Q229,326 268,308" fill="#c8bca8"/>

  <!-- 取っ手 -->
  <path d="M525,250 Q590,240 600,290 Q605,330 565,345 Q545,350 530,340" fill="none" stroke="#2a1f1a" stroke-width="18" stroke-linecap="round"/>
  <path d="M525,250 Q588,241 597,290 Q602,328 563,343 Q544,348 530,339" fill="none" stroke="#c8bca8" stroke-width="10" stroke-linecap="round"/>

