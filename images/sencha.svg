  <!-- テキスト -->
  <text x="400" y="520" font-family="'Noto Serif JP', serif" font-size="32" fill="#2a4f39" text-anchor="middle" letter-spacing="8" opacity="0.9">煎茶</text>
  <text x="400" y="555" font-family="serif" font-size="14" fill="#2a4f39" text-anchor="middle" letter-spacing="4" opacity="0.6">SENCHA</text>
